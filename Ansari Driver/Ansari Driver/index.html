<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansari Driver</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <div id="hud">
            <div>ANSARI DRIVER</div>
            <div>Score: <span id="score">0</span></div>
        </div>

        <div id="road">

            <div id="player">
            <img src="assets/cars/player.png" alt="Player Car">
            </div>

            <div class="obstacle obstacle1">
            <img src="assets/cars/enemy1.png" alt="Enemy Car 1">
            </div>
            <div class="obstacle obstacle2">
            <img src="assets/cars/enemy2.png" alt="Enemy Car 2">
            </div>
            <div class="obstacle obstacle3">🚧</div>

        </div>

        <div id="startScreen">
            <h1>ANSARI DRIVER</h1>
            <p>Endless Road Challenge</p>
            <button onclick="startGame()">START GAME</button>
        </div>

        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>

        <div id="controls">
            <button id="leftBtn">⬅</button>
            <button id="rightBtn">➡</button>
        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
